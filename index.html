<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TOP - Sign-up Form</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=aclonica:400" rel="stylesheet" />    
</head>
<body>
    <header></header>
    <main>
        <div class="side">
            <div id="odin_logo">
                <img src="/images/odin-lined.png" alt="Odin Logo"><p>Odin</p>
            </div>
            <img src="/images/cat.jpg" alt="Russian Blue Cat Wearing Yellow Sunglasses">
            Photo by <a href="https://unsplash.com/@raouldroog?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Raoul Droog</a> on <a href="https://unsplash.com/photos/russian-blue-cat-wearing-yellow-sunglasses-yMSecCHsIBc?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </div>
        <div class="form-layout">
            <div class="top">
                This is not a real online service. You know you need something like this your life to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.

                You <em>know</em> you want to.
            </div>
            <div class="middle">
                <form action="#" method="get">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_nae">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password"> 
                </form>
            </div>            
            <div class="bottom">
                <button type="button">Create Account</button>
                Already have an account? <a href="#">Log in</a>
            </div>
        </div>

    </main>
    <footer></footer>
</body>
</html>
