<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TOP - Sign-up Form</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=aclonica:400" rel="stylesheet" />    
</head>
<body>
    <header></header>
    <main>
        <div class="side">
            <div id="odin_logo">
                <img src="images/odin-lined.png" alt="Odin Logo"><p>Odin</p>
            </div>
            <div id="photo_credit">Photo by <a href="https://unsplash.com/@raouldroog?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Raoul Droog</a> on <a href="https://unsplash.com/photos/russian-blue-cat-wearing-yellow-sunglasses-yMSecCHsIBc?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></div>
        </div>
        <div id="form-layout">
            <div id="top">
                <p>
                    This is not a real online service. You know you need something like this your life to help you realize your deepest dreams.
                    <br>Sign up <em>now</em> to get started.
                </p>
                <p>
                    You <em>know</em> you want to.
                </p>
            </div>
            <div id="middle">
                <h2>Let's do this!</h2>
                <form action="#" method="post" id="collect_form">
                    <div class="form_input">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form_input">          
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>     
                    <div class="form_input">                           
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div> 
                    <div class="form_input">                                           
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form_input">                          
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required pattern="\w{5,15}" title="Must be 5 to 15 characters: a-z, A-Z, 0-9, including _ (underscore).">
                    </div>
                    <div class="form_input">                          
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required pattern="\w{5,15}" title="Must be 5 to 15 characters: a-z, A-Z, 0-9, including _ (underscore)."> 
                    </div>
                </form>
            </div>            
            <div id="bottom">
                <button type="submit" form="collect_form">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>

    </main>
    <footer></footer>
</body>
</html>
